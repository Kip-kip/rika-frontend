<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1e222e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <!-- wall -->
  <rect x="120" y="80" width="960" height="540" rx="6" fill="#171a23" stroke="#2a2f3d" stroke-width="3"/>
  <!-- window frame -->
  <rect x="170" y="130" width="860" height="440" rx="4" fill="#0f1117" stroke="#3b82f6" stroke-width="10"/>
  <!-- mullions -->
  <line x1="460" y1="130" x2="460" y2="570" stroke="#3b82f6" stroke-width="8"/>
  <line x1="740" y1="130" x2="740" y2="570" stroke="#3b82f6" stroke-width="8"/>
  <!-- glass panes -->
  <rect x="180" y="140" width="270" height="420" fill="url(#glass)"/>
  <rect x="470" y="140" width="260" height="420" fill="url(#glass)"/>
  <rect x="750" y="140" width="270" height="420" fill="url(#glass2)"/>
  <!-- highlight -->
  <line x1="200" y1="170" x2="320" y2="320" stroke="#e8eaef" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="480" y1="170" x2="600" y2="320" stroke="#e8eaef" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="760" y1="170" x2="880" y2="320" stroke="#e8eaef" stroke-opacity="0.15" stroke-width="2"/>
</svg>
